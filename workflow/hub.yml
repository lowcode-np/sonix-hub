name: sonix-hub

on:
  schedule:
    - cron: "7 * * * *"          # every hour at :07 UTC (GitHub may start a few minutes late)
    - cron: "11 4 1 * *"         # monthly keepalive: GitHub disables schedules after 60 days of no commits
  workflow_dispatch: {}          # "Run workflow" button for manual runs

permissions:
  contents: read
  pages: write                   # publish the feed with the official Pages actions
  id-token: write                # required by deploy-pages

concurrency:
  group: sonix-hub
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # the API keys live in this environment (Settings -> Environments -> github-pages)
    # repository-level secrets work too and do not need this line
    environment: github-pages
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build feed
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          THAILLM_API_KEY: ${{ secrets.THAILLM_API_KEY }}
          THAILLM_MODEL: ${{ vars.THAILLM_MODEL }}
          THAILLM_BASE: ${{ vars.THAILLM_BASE }}
          LLM_ORDER: ${{ vars.LLM_ORDER }}
          RSS_FEEDS: ${{ vars.RSS_FEEDS }}      # empty = built-in list; set to drop sources that 403 from cloud IPs
          FEED_URL: ${{ vars.FEED_URL }}      # keeps history.json between runs
        run: python -m hub.run --out public

      # never publish a broken feed to the EA
      - name: Validate feed
        run: |
          python - <<'PY'
          import json
          d = json.load(open("public/v1/xauusd.json", encoding="utf-8"))
          assert d["bias"] in ("BUY", "SELL", "NEUTRAL"), d["bias"]
          assert isinstance(d["ts"], int) and d["ts"] > 0
          assert isinstance(d["ttl"], int) and d["ttl"] >= 300
          assert list(d)[:3] == ["ver", "ts", "ttl"], list(d)[:3]
          print("feed ok:", d["bias"], d["score"], d["provider"], "errors", len(d["status"]["errors"]))
          PY

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  keepalive:
    # GitHub disables scheduled workflows after 60 days without commits.
    # One tiny commit a month keeps the hourly schedule alive.
    if: github.event_name == 'schedule' && github.event.schedule == '11 4 1 * *'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Touch keepalive file
        run: |
          date -u +"keepalive %Y-%m-%dT%H:%MZ" > .keepalive
          git config user.name sonix-hub-bot
          git config user.email sonix-hub-bot@users.noreply.github.com
          git add .keepalive
          git commit -m "chore: keepalive $(date -u +%Y-%m)"
          git push
