services:
  sonix-hub:
    build: .
    image: sonix-hub:1
    container_name: sonix-hub
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      HUB_STATE_DIR: /data
      PORT: "8080"
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request;urllib.request.urlopen('http://127.0.0.1:%s/healthz' % os.environ.get('PORT','8080'), timeout=5)"]
      interval: 30s
      timeout: 6s
      start_period: 45s
      retries: 3
